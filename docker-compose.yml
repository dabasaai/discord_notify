services:
  discord-notify:
    build: .
    image: discord-notify:latest
    container_name: discord-notify
    restart: unless-stopped
    env_file: .env
    environment:
      CHANNELS_FILE: /app/channels.json
    ports:
      - "127.0.0.1:${PORT:-3020}:${PORT:-3020}"
    volumes:
      - ./channels.json:/app/channels.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT||3020) + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
